services:
  # Spring Boot API container. It talks to Postgres and Redis over the Compose network.
  backend:
    build:
      context: .
    container_name: data-platform-backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/dataplatform
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JPA_SHOW_SQL: "true"
      HIBERNATE_FORMAT_SQL: "true"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Vue frontend served by Vite; proxies API calls to the backend service.
  frontend:
    build:
      context: ./frontend
    container_name: data-platform-frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # Durable relational store for accepted import records.
  postgres:
    image: postgres:17
    container_name: data-platform-postgres
    environment:
      POSTGRES_DB: dataplatform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dataplatform"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Reserved for fast summaries and query caching in the next backend phase.
  redis:
    image: redis:7-alpine
    container_name: data-platform-redis
    ports:
      - "56379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
