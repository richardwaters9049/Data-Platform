services:
  # Vue frontend served by Vite; proxies API calls to the backend running locally.
  frontend:
    build:
      context: ./frontend
    container_name: data-platform-frontend
    environment:
      VITE_API_PROXY_TARGET: http://host.docker.internal:8081
    ports:
      - "5173:5173"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Durable relational store for accepted import records.
  postgres:
    image: postgres:17
    container_name: data-platform-postgres
    environment:
      POSTGRES_DB: dataplatform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dataplatform"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Reserved for fast summaries and query caching in the next backend phase.
  redis:
    image: redis:7-alpine
    container_name: data-platform-redis
    ports:
      - "56379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
